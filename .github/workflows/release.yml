name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Reserved for future Maven Central and Homebrew publication; GitHub publication is unchanged.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-dispatch-ref:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: "🛡️ Branch [${{ github.ref_name }}]"
        shell: sh
        run: |
          set -eu
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            printf '%s\n' "Release publication must run from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build:
    name: Build
    needs:
      - validate-dispatch-ref
    if: ${{ always() && (needs.validate-dispatch-ref.result == 'success' || needs.validate-dispatch-ref.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ github.sha }}
      prepare_publication: true
      bootstrap_generation: 3
    secrets: inherit

  publish-central:
    name: Central
    needs:
      - build
    if: ${{ false }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/publish-central.yml
    with:
      run_id: ${{ github.run_id }}
      dry_run: ${{ inputs.dry_run }}
      build_output_timestamp: ${{ needs.build.outputs.build_output_timestamp }}
    secrets: inherit

  publish-github-packages:
    name: Packages
    needs:
      - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      run_id: ${{ github.run_id }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  publish:
    name: GitHub
    needs:
      - build
      - publish-github-packages
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.publish-github-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: "🧑‍💻 Checkout [${{ needs.build.outputs.commit_sha }}]"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}

      - name: "📥 Download [${{ needs.build.outputs.resolved_version }}]"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: javan-*
          path: dist/release
          merge-multiple: true

      - name: "🍺 Homebrew [${{ needs.build.outputs.resolved_version }}]"
        shell: sh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
        run: .github/scripts/generate-homebrew-formula.sh "$RELEASE_VERSION" "${GITHUB_REPOSITORY}"

      - name: "🍺 Formula [${{ needs.build.outputs.resolved_version }}]"
        shell: sh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
        run: .github/scripts/verify-homebrew-formula.sh dist/release/javan.rb "$RELEASE_VERSION" "${GITHUB_REPOSITORY}"

      - name: "🚀 Publish [${{ needs.build.outputs.resolved_version }}]"
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
          TARGET_SHA: ${{ needs.build.outputs.commit_sha }}
        run: |
          set -eu
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            printf '%s\n' "GitHub release already exists for $RELEASE_VERSION"
          else
            gh release create "$RELEASE_VERSION" \
              --target "$TARGET_SHA" \
              --title "$RELEASE_VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" dist/release/* --clobber

  containers:
    name: Containers
    needs:
      - build
      - publish
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-images.yml
    with:
      tag: ${{ needs.build.outputs.resolved_version }}
    secrets: inherit
