name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build release packages without committing, tagging, or publishing.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-dispatch-ref:
    name: Validate
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Branch
        shell: sh
        run: |
          set -eu
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            printf '%s\n' "Release publication must run from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build:
    name: Build
    needs:
      - validate-dispatch-ref
    if: ${{ always() && (needs.validate-dispatch-ref.result == 'success' || needs.validate-dispatch-ref.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-common.yml
    with:
      ref: ${{ github.sha }}
      prepare_publication: true
      bootstrap_generation: 3
      package_timeout_minutes: 90
    secrets: inherit

  publish-central:
    name: Central
    needs:
      - build
    if: ${{ false }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/publish-central.yml
    with:
      run_id: ${{ github.run_id }}
      dry_run: ${{ inputs.dry_run }}
      build_output_timestamp: ${{ needs.build.outputs.build_output_timestamp }}
    secrets: inherit

  publish:
    name: GitHub
    needs:
      - build
    if: inputs.dry_run != true && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Token
        shell: sh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -eu
          : "${BOT_TOKEN:?Missing required secret: BOT_TOKEN}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
          token: ${{ secrets.BOT_TOKEN }}

      - name: Download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: javan-*
          path: dist/release
          merge-multiple: true

      - name: Homebrew
        shell: sh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
        run: .github/scripts/generate-homebrew-formula.sh "$RELEASE_VERSION" "${GITHUB_REPOSITORY}"

      - name: Formula
        shell: sh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
        run: .github/scripts/verify-homebrew-formula.sh dist/release/javan.rb "$RELEASE_VERSION" "${GITHUB_REPOSITORY}"

      - name: Metadata
        shell: sh
        env:
          RELEASE_TAG: ${{ format('v{0}', needs.build.outputs.resolved_version) }}
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
        run: |
          set -eu
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            printf '%s\n' "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          if [ ! -f CHANGELOG.md ]; then
            {
              printf '%s\n\n' '# Changelog'
              printf '%s\n\n' '## [Unreleased]'
            } > CHANGELOG.md
          fi

          release_date=$(date -u +%Y-%m-%d)
          if ! grep -Eq "^## \\[$RELEASE_VERSION\\]" CHANGELOG.md; then
            awk -v version="$RELEASE_VERSION" -v release_date="$release_date" '
              /^## \[Unreleased\]/ && !done {
                print
                print ""
                print "## [" version "] - " release_date
                print ""
                print "- Release verified host-native Javan binary archives."
                print "- Enable replayable container image publication from release assets."
                done = 1
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          fi

          awk -v version="$RELEASE_VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Javan %s\n' "$RELEASE_TAG" > release-notes.md
          fi

      - name: Commit
        shell: sh
        env:
          RELEASE_TAG: ${{ format('v{0}', needs.build.outputs.resolved_version) }}
          RELEASE_VERSION: ${{ needs.build.outputs.resolved_version }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -eu
          git config user.name "Kira"
          git config user.email "kira@yuna.berlin"
          git remote set-url origin "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore: release $RELEASE_VERSION [skip ci]"
          fi
          git push origin HEAD:main
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG [skip ci]"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ format('v{0}', needs.build.outputs.resolved_version) }}
        run: >-
          gh release create "$RELEASE_TAG" dist/release/*
          --verify-tag
          --title "$RELEASE_TAG"
          --notes-file release-notes.md
