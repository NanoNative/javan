name: Native

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      label:
        required: true
        type: string
      sanitizer_scope:
        required: true
        type: string
      proof:
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      version:
        required: true
        type: string
      bootstrap_generation:
        required: false
        default: 3
        type: number
      timeout_minutes:
        required: false
        default: 45
        type: number
      package_scope:
        required: false
        default: full
        type: string

permissions: {}

jobs:
  verify:
    name: ${{ inputs.label }}
    if: inputs.enabled
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      JAVAN_VERSION: ${{ inputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Java
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # 3

      - name: JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ steps.java_info.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Version
        shell: sh
        run: ./mvnw -B versions:set -DnewVersion="$JAVAN_VERSION" -DgenerateBackupPoms=false

      - name: Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Rust
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0

      - name: Toolchains
        shell: sh
        run: |
          set -eu
          go version
          rustc --version

      - name: Linux
        if: runner.os == 'Linux'
        shell: sh
        run: |
          set -eu
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update \
              && sudo apt-get -o Acquire::ForceIPv4=true install -y --fix-missing build-essential mingw-w64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Windows
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Repository
        shell: sh
        run: |
          set -eu
          repo=$(./mvnw -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)
          printf 'MAVEN_REPO_LOCAL=%s\n' "$repo" >> "$GITHUB_ENV"

      - name: Probes
        shell: sh
        run: sh .github/scripts/install-external-probe-artifacts.sh "$MAVEN_REPO_LOCAL"

      - name: Compile
        shell: sh
        run: >-
          ./mvnw -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -DskipTests compile test-compile

      - name: Acceptance
        if: inputs.proof == 'acceptance'
        shell: sh
        env:
          JAVAN_MAVEN_REPO: ${{ env.MAVEN_REPO_LOCAL }}
          JAVAN_REQUIRE_EXTERNAL_SMOKE: "true"
        run: sh .github/scripts/acceptance.sh

      - name: Target
        if: inputs.proof == 'acceptance'
        shell: sh
        run: java -cp target/classes javan.Main build src/test/resources/projects/acceptance/hello --target '${{ inputs.target }}' --output 'hello-${{ inputs.target }}'

      - name: Sanitizer
        if: inputs.proof == 'sanitizer'
        shell: sh
        env:
          JAVAN_SANITIZER_REQUIRED: "true"
          JAVAN_SANITIZER_SCOPE: ${{ inputs.sanitizer_scope }}
        run: sh .github/scripts/sanitizer-suite.sh

      - name: Package
        if: inputs.proof == 'package-self-host'
        shell: sh
        env:
          CC: ${{ inputs.bootstrap_generation == 2 && 'clang' || '' }}
          JAVAN_PACKAGE_PROOF_SCOPE: ${{ inputs.package_scope }}
          JAVAN_PACKAGE_TARGET: ${{ inputs.target }}
          JAVAN_PACKAGE_SANITIZER_SCOPE: ${{ inputs.sanitizer_scope }}
          JAVAN_BOOTSTRAP_GENERATION: ${{ inputs.bootstrap_generation }}
        run: sh .github/scripts/verify-ci-package-smoke.sh

      - name: Upload
        if: inputs.proof == 'package-self-host'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: javan-${{ inputs.target }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/release/javan-*-${{ inputs.target }}.tar.gz
            dist/release/javan-*-${{ inputs.target }}.tar.gz.sha256
