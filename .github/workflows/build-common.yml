name: CI · Common Build

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      prepare_publication:
        required: false
        default: false
        type: boolean
      snapshot:
        required: false
        default: false
        type: boolean
    outputs:
      resolved_version:
        description: Version used for publication artifacts
        value: ${{ jobs.build-info.outputs.resolved_version }}
      commit_sha:
        description: Commit built by this workflow
        value: ${{ jobs.build-info.outputs.commit_sha }}
      build_output_timestamp:
        description: Reproducible build timestamp from the built commit
        value: ${{ jobs.build-info.outputs.build_output_timestamp }}
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ''
        type: string
      snapshot:
        description: Append -SNAPSHOT to the UTC date version
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build-info:
    name: Build metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      resolved_version: ${{ steps.info.outputs.resolved_version }}
      commit_sha: ${{ steps.info.outputs.commit_sha }}
      build_output_timestamp: ${{ steps.info.outputs.build_output_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve immutable build information
        id: info
        shell: sh
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -eu
          version=$(date -u +%Y.%m.%d)
          if [ "$SNAPSHOT" = "true" ]; then
            version=$version-SNAPSHOT
          fi
          {
            printf 'resolved_version=%s\n' "$version"
            printf 'commit_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'build_output_timestamp=%s\n' "$(git log -1 --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

  verify-core:
    name: Core tests · Linux x64
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read Java info
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # 3

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ steps.java_info.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0

      - name: Verify binding toolchains
        run: |
          go version
          rustc --version

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update \
              && sudo apt-get -o Acquire::ForceIPv4=true install -y --fix-missing build-essential mingw-w64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Resolve Maven local repository
        run: |
          repo=$(./mvnw -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)
          echo "MAVEN_REPO_LOCAL=$repo" >> "$GITHUB_ENV"

      - name: Install bundled external smoke artifacts
        run: |
          sh .github/scripts/install-external-probe-artifacts.sh "$MAVEN_REPO_LOCAL"

      - name: Verify core Maven suite
        run: |
          status=0
          ./mvnw -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -Dexec.skip=true -Dtest='!Cli*IntegrationTest,!CliExternalProbeAcceptanceIntegrationTest' verify || status=$?

          if find target -maxdepth 1 -type f -name 'jacoco-surefire-*.exec' -print -quit | grep -q . \
            || [ -d target/jacoco-child ]; then
            ./mvnw -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -DskipTests jacoco:merge@merge-coverage jacoco:report@report || true
          fi

          if [ "$status" -ne 0 ]; then
            python3 -c $'import pathlib\nimport xml.etree.ElementTree as ET\n\nreport = pathlib.Path("target/site/jacoco/jacoco.xml")\nif not report.exists():\n    print("JaCoCo report missing after failed verify.")\nelse:\n    root = ET.parse(report).getroot()\n    bundle = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}\n    for counter_type in ("BRANCH", "LINE"):\n        counter = bundle.get(counter_type)\n        if counter is None:\n            continue\n        missed = int(counter["missed"])\n        covered = int(counter["covered"])\n        total = missed + covered\n        ratio = covered / total if total else 1.0\n        print(f"JaCoCo {counter_type.lower()} bundle ratio: {covered}/{total} = {ratio:.6%}")'
            exit "$status"
          fi

      - name: Report coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("target/site/jacoco/jacoco.xml")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report.exists():
              print("JaCoCo report missing; coverage summary skipped.")
              summary_path.write_text(
                  "# Coverage\n\nJaCoCo report missing. Coverage summary skipped.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}
          summary_lines = [
              "# Coverage",
              "",
              "| Counter | Covered | Total | Ratio |",
              "| --- | ---: | ---: | ---: |",
          ]
          for counter_type in ("LINE", "BRANCH"):
              counter = counters.get(counter_type)
              if counter is None:
                  continue
              missed = int(counter["missed"])
              covered = int(counter["covered"])
              total = missed + covered
              ratio = covered / total if total else 1.0
              print(f"JaCoCo {counter_type.lower()} coverage: {covered}/{total} = {ratio:.2%}")
              summary_lines.append(
                  f"| {counter_type.lower()} | {covered} | {total} | {ratio:.2%} |"
              )
          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY

  verify-cli-integration:
    name: CLI tests · ${{ matrix.shard }} · Linux x64
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        include:
          - shard: cli-general
            test-selector: >-
              Cli*IntegrationTest,!CliExternalProbeAcceptanceIntegrationTest,!CliPackagingIntegrationTest,!CliJdkSemanticsIntegrationTest,!CliThreadRuntimeIntegrationTest,!CliRuntimeTranslationIntegrationTest
          - shard: cli-jdk-semantics
            test-selector: >-
              CliJdkSemanticsIntegrationTest
          - shard: cli-thread-runtime
            test-selector: >-
              CliThreadRuntimeIntegrationTest
          - shard: cli-runtime-translation
            test-selector: >-
              CliRuntimeTranslationIntegrationTest
          - shard: cli-packaging
            test-selector: >-
              CliPackagingIntegrationTest
          - shard: cli-external-probes
            test-selector: >-
              CliExternalProbeAcceptanceIntegrationTest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read Java info
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # 3

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ steps.java_info.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0

      - name: Verify binding toolchains
        run: |
          go version
          rustc --version

      - name: Install Linux native toolchain
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update \
              && sudo apt-get -o Acquire::ForceIPv4=true install -y --fix-missing build-essential mingw-w64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Resolve Maven local repository
        run: |
          repo=$(./mvnw -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)
          echo "MAVEN_REPO_LOCAL=$repo" >> "$GITHUB_ENV"

      - name: Install bundled external smoke artifacts
        run: |
          sh .github/scripts/install-external-probe-artifacts.sh "$MAVEN_REPO_LOCAL"

      - name: Verify CLI integration Maven suite
        run: |
          status=0
          ./mvnw -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -Dexec.skip=true -Dtest='${{ matrix.test-selector }}' verify || status=$?

          if find target -maxdepth 1 -type f -name 'jacoco-surefire-*.exec' -print -quit | grep -q . \
            || [ -d target/jacoco-child ]; then
            ./mvnw -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -DskipTests jacoco:merge@merge-coverage jacoco:report@report || true
          fi

          if [ "$status" -ne 0 ]; then
            python3 -c $'import pathlib\nimport xml.etree.ElementTree as ET\n\nreport = pathlib.Path("target/site/jacoco/jacoco.xml")\nif not report.exists():\n    print("JaCoCo report missing after failed verify.")\nelse:\n    root = ET.parse(report).getroot()\n    bundle = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}\n    for counter_type in ("BRANCH", "LINE"):\n        counter = bundle.get(counter_type)\n        if counter is None:\n            continue\n        missed = int(counter["missed"])\n        covered = int(counter["covered"])\n        total = missed + covered\n        ratio = covered / total if total else 1.0\n        print(f"JaCoCo {counter_type.lower()} bundle ratio: {covered}/{total} = {ratio:.6%}")'
            exit "$status"
          fi

      - name: Report coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("target/site/jacoco/jacoco.xml")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report.exists():
              print("JaCoCo report missing; coverage summary skipped.")
              summary_path.write_text(
                  "# Coverage\n\nJaCoCo report missing. Coverage summary skipped.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}
          summary_lines = [
              "# Coverage",
              "",
              "| Counter | Covered | Total | Ratio |",
              "| --- | ---: | ---: | ---: |",
          ]
          for counter_type in ("LINE", "BRANCH"):
              counter = counters.get(counter_type)
              if counter is None:
                  continue
              missed = int(counter["missed"])
              covered = int(counter["covered"])
              total = missed + covered
              ratio = covered / total if total else 1.0
              print(f"JaCoCo {counter_type.lower()} coverage: {covered}/{total} = {ratio:.2%}")
              summary_lines.append(
                  f"| {counter_type.lower()} | {covered} | {total} | {ratio:.2%} |"
              )
          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY

  native-acceptance:
    name: Native acceptance · ${{ matrix.target }}
    needs:
      - build-info
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            sanitizer-scope: full
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            sanitizer-scope: platform-smoke
    uses: ./.github/workflows/native-proof.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      sanitizer_scope: ${{ matrix.sanitizer-scope }}
      proof: acceptance
      version: ${{ needs.build-info.outputs.resolved_version }}
    secrets: inherit

  native-sanitizer:
    name: Native sanitizer · ${{ matrix.target }}
    needs:
      - build-info
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            sanitizer-scope: full
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            sanitizer-scope: platform-smoke
    uses: ./.github/workflows/native-proof.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      sanitizer_scope: ${{ matrix.sanitizer-scope }}
      proof: sanitizer
      version: ${{ needs.build-info.outputs.resolved_version }}
    secrets: inherit

  native-package-self-host:
    name: Native package · ${{ matrix.target }}
    needs:
      - build-info
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            sanitizer-scope: full
            enabled: true
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            sanitizer-scope: platform-smoke
            enabled: true
          - target: macos-x64
            os: macos-15-intel
            sanitizer-scope: platform-smoke
            enabled: false
            reason: historical slower architecture lane
          - target: macos-aarch64
            os: macos-15
            sanitizer-scope: platform-smoke
            enabled: false
            reason: local self-host proof exceeded the 45-minute job projection
          - target: windows-x64
            os: windows-2025
            sanitizer-scope: platform-smoke
            enabled: false
            reason: native linker and process runtime are incomplete
          - target: windows-aarch64
            os: windows-11-arm
            sanitizer-scope: platform-smoke
            enabled: false
            reason: native linker and process runtime are incomplete
    uses: ./.github/workflows/native-proof.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      sanitizer_scope: ${{ matrix.sanitizer-scope }}
      proof: package-self-host
      enabled: ${{ matrix.enabled }}
      version: ${{ needs.build-info.outputs.resolved_version }}
    secrets: inherit

  platform-smoke:
    name: Platform smoke · ${{ matrix.target }}
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            enabled: true
          - target: linux-arm64
            os: ubuntu-24.04-arm
            enabled: true
          - target: macos-x64
            os: macos-15-intel
            enabled: true
          - target: macos-arm64
            os: macos-15
            enabled: true
          - target: windows-x64
            os: windows-2025
            enabled: true
          - target: windows-arm64
            os: windows-11-arm
            enabled: false
            reason: Temurin 25 is unavailable on the GitHub-hosted Windows ARM64 runner
    permissions:
      contents: read
    uses: ./.github/workflows/platform-proof.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      enabled: ${{ matrix.enabled }}
    secrets: inherit

  windows-runtime-smoke:
    name: Windows runtime · ${{ matrix.shard }} · x64
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - shard: current-thread
            test-selector: >-
              javan.codegen.RuntimeFilesTest#
          - shard: worker-thread
            test-selector: >-
              javan.codegen.RuntimeFilesTest#

    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read Java info
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # 3

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ steps.java_info.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Set up MSYS2 toolchain
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows C compiler
        shell: pwsh
        run: |
          gcc --version

      - name: Verify Windows runtime smoke
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin\\gcc.exe
        run: >-
          ./mvnw.cmd -q
          '-Dtest=${{ matrix.test-selector }}'
          test

  prepare-publication:
    name: Prepare Maven publication
    needs:
      - build-info
      - verify-core
      - verify-cli-integration
      - native-acceptance
      - native-sanitizer
      - native-package-self-host
      - platform-smoke
      - windows-runtime-smoke
    if: inputs.prepare_publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build-info.outputs.commit_sha }}

      - name: Read Java info
        id: java_info
        uses: YunaBraska/java-info-action@11a434ffbf6bb3357363d1933be71a4076a90a6b # 3

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ steps.java_info.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: Build publication artifacts without repeating tests
        shell: sh
        env:
          BUILD_OUTPUT_TIMESTAMP: ${{ needs.build-info.outputs.build_output_timestamp }}
          RELEASE_VERSION: ${{ needs.build-info.outputs.resolved_version }}
        run: >-
          ./mvnw -B versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          && ./mvnw -B -Ppublish -DskipTests -Dgpg.skip=true
          -Dproject.build.outputTimestamp="$BUILD_OUTPUT_TIMESTAMP" package

      - name: Upload publication workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-workspace
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .mvn
            mvnw
            mvnw.cmd
            pom.xml
            src
            target/*.jar
