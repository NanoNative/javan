name: Platform

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      label:
        required: true
        type: string
      enabled:
        required: true
        type: boolean

permissions: {}

jobs:
  platform-proof:
    name: ${{ inputs.label }}
    if: inputs.enabled
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: "🪟 Longpaths [${{ inputs.label }}]"
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: "🧑‍💻 Checkout [${{ inputs.ref || github.sha }}]"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: "🔍 Java"
        id: java_info
        uses: YunaBraska/java-info-action@7a178ff2b0222107efbaab0c457c2ff09a84a801 # 3.0.14

      - name: "☕ JDK [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ steps.java_info.outputs.java_version }}
          distribution: temurin
          cache: maven

      - name: "🧪 Verify [${{ inputs.label }}]"
        shell: bash
        run: ./mvnw -q -Dgroups=platform test
