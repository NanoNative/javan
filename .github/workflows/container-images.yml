name: Containers

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish images from, for example 2026.7.31.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      repository: ${{ steps.plan.outputs.repository }}
    steps:
      - name: "🧮 Plan [${{ github.event.release.tag_name || inputs.tag }}]"
        id: plan
        shell: sh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then
            tag="$INPUT_TAG"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]{4}[.]([1-9]|1[0-2])[.]([1-9]|[12][0-9]|3[01])$'; then
            printf '%s\n' "Tag must use YYYY.M.D without leading zeroes: $tag" >&2
            exit 1
          fi

          repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$tag"
            printf 'repository=%s\n' "$repository"
          } | tee -a "$GITHUB_OUTPUT"

  native-images:
    name: native_images
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
            archive-target: x64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
            archive-target: aarch64
    steps:
      - name: "🧑‍💻 Checkout [${{ needs.plan.outputs.tag }}]"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: "📥 Download [${{ matrix.platform }}]"
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          ARCHIVE_TARGET: ${{ matrix.archive-target }}
        run: |
          mkdir -p dist/release
          archive="javan-${RELEASE_VERSION}-linux-${ARCHIVE_TARGET}.tar.gz"
          gh release download "$RELEASE_TAG" --dir dist/release --pattern "$archive"
          gh release download "$RELEASE_TAG" --dir dist/release --pattern "$archive.sha256"
          (cd dist/release && sha256sum -c "$archive.sha256")

      - name: "🧰 Buildx [${{ matrix.platform }}]"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "🔐 Login [ghcr]"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: "📦 Wolfi [${{ matrix.platform }}]"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/containers/javan-wolfi.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            JAVAN_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=javan
            org.opencontainers.image.description=Javan native-first Java toolchain
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          tags: |
            ${{ needs.plan.outputs.repository }}:${{ needs.plan.outputs.version }}-${{ matrix.architecture }}
            ${{ needs.plan.outputs.repository }}:${{ needs.plan.outputs.version }}-wolfi-${{ matrix.architecture }}
            ${{ needs.plan.outputs.repository }}:latest-${{ matrix.architecture }}
            ${{ needs.plan.outputs.repository }}:wolfi-${{ matrix.architecture }}

      - name: "📦 Distroless [${{ matrix.platform }}]"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/containers/javan-distroless.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            JAVAN_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=javan
            org.opencontainers.image.description=Javan native-first Java toolchain
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          tags: |
            ${{ needs.plan.outputs.repository }}:${{ needs.plan.outputs.version }}-distroless-${{ matrix.architecture }}
            ${{ needs.plan.outputs.repository }}:distroless-${{ matrix.architecture }}

      - name: "📦 Scratch [${{ matrix.platform }}]"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/containers/javan-scratch.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            JAVAN_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=javan
            org.opencontainers.image.description=Javan native-first Java toolchain
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          tags: |
            ${{ needs.plan.outputs.repository }}:${{ needs.plan.outputs.version }}-scratch-${{ matrix.architecture }}
            ${{ needs.plan.outputs.repository }}:scratch-${{ matrix.architecture }}

  manifests:
    name: Manifests
    needs:
      - plan
      - native-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "🧑‍💻 Checkout [${{ needs.plan.outputs.tag }}]"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: "📥 Download [${{ needs.plan.outputs.version }}]"
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p dist/release
          for target in linux-x64 linux-aarch64
          do
            archive="javan-${RELEASE_VERSION}-${target}.tar.gz"
            gh release download "$RELEASE_TAG" --dir dist/release --pattern "$archive"
            gh release download "$RELEASE_TAG" --dir dist/release --pattern "$archive.sha256"
            (cd dist/release && sha256sum -c "$archive.sha256")
          done

      - name: "🧰 Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "🔐 Login [ghcr]"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: "📋 Publish [${{ needs.plan.outputs.version }}]"
        shell: sh
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          publish_manifest() {
            tag=$1
            docker buildx imagetools create \
              --tag "$IMAGE_REPOSITORY:$tag" \
              "$IMAGE_REPOSITORY:$tag-amd64" \
              "$IMAGE_REPOSITORY:$tag-arm64"
          }

          for tag in \
            "$RELEASE_VERSION" \
            "$RELEASE_VERSION-wolfi" \
            "$RELEASE_VERSION-distroless" \
            "$RELEASE_VERSION-scratch" \
            latest \
            wolfi \
            distroless \
            scratch
          do
            publish_manifest "$tag"
          done

      - name: "📋 Verify [${{ needs.plan.outputs.version }}]"
        shell: sh
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          for tag in \
            "$RELEASE_VERSION" \
            "$RELEASE_VERSION-wolfi" \
            "$RELEASE_VERSION-distroless" \
            "$RELEASE_VERSION-scratch" \
            latest \
            wolfi \
            distroless \
            scratch
          do
            sh .github/scripts/verify-image.sh "$IMAGE_REPOSITORY:$tag"
          done

      - name: "🧪 Showcase [${{ needs.plan.outputs.version }}]"
        shell: sh
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          image="$IMAGE_REPOSITORY:$RELEASE_VERSION"
          JAVAN_IMAGE="$image" sh .github/scripts/verify-showcase.sh
