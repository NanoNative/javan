name: Containers

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish images from, for example 2026.7.31.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "🧮 Plan [${{ github.event.release.tag_name || inputs.tag }}]"
        id: plan
        shell: sh
        env:
          EVENT_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then
            tag="$INPUT_TAG"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]{4}[.]([1-9]|1[0-2])[.]([1-9]|[12][0-9]|3[01])$'; then
            printf '%s\n' "Tag must use YYYY.M.D without leading zeroes: $tag" >&2
            exit 1
          fi

          version=$tag
          repository="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'repository=%s\n' "$repository"
            printf 'wolfi_tags<<EOF\n'
            printf '%s:%s\n' "$repository" "$version"
            printf '%s:%s-wolfi\n' "$repository" "$version"
            printf '%s:latest\n' "$repository"
            printf '%s:wolfi\n' "$repository"
            printf 'EOF\n'
            printf 'distroless_tags<<EOF\n'
            printf '%s:%s-distroless\n' "$repository" "$version"
            printf '%s:distroless\n' "$repository"
            printf 'EOF\n'
            printf 'scratch_tags<<EOF\n'
            printf '%s:%s-scratch\n' "$repository" "$version"
            printf '%s:scratch\n' "$repository"
            printf 'EOF\n'
          } | tee -a "$GITHUB_OUTPUT"

      - name: "🧑‍💻 Checkout [${{ steps.plan.outputs.tag }}]"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.plan.outputs.tag }}

      - name: "📥 Download [${{ steps.plan.outputs.version }}]"
        shell: sh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir -p dist/release
          gh release download "$RELEASE_TAG" --dir dist/release --pattern "javan-${RELEASE_VERSION}-linux-x64.tar.gz"
          gh release download "$RELEASE_TAG" --dir dist/release --pattern "javan-${RELEASE_VERSION}-linux-x64.tar.gz.sha256"
          gh release download "$RELEASE_TAG" --dir dist/release --pattern "javan-${RELEASE_VERSION}-linux-aarch64.tar.gz"
          gh release download "$RELEASE_TAG" --dir dist/release --pattern "javan-${RELEASE_VERSION}-linux-aarch64.tar.gz.sha256"
          cd dist/release
          sha256sum -c "javan-${RELEASE_VERSION}-linux-x64.tar.gz.sha256"
          sha256sum -c "javan-${RELEASE_VERSION}-linux-aarch64.tar.gz.sha256"

      - name: "🧰 QEMU"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: "🧰 Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "🔐 Login [ghcr]"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: "📦 Wolfi [${{ steps.plan.outputs.version }}]"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/containers/javan-wolfi.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVAN_VERSION=${{ steps.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=javan
            org.opencontainers.image.description=Javan native-first Java toolchain
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
          tags: ${{ steps.plan.outputs.wolfi_tags }}

      - name: "📦 Distroless [${{ steps.plan.outputs.version }}]"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/containers/javan-distroless.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVAN_VERSION=${{ steps.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=javan
            org.opencontainers.image.description=Javan native-first Java toolchain
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
          tags: ${{ steps.plan.outputs.distroless_tags }}

      - name: "📦 Scratch [${{ steps.plan.outputs.version }}]"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/containers/javan-scratch.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVAN_VERSION=${{ steps.plan.outputs.version }}
          labels: |
            org.opencontainers.image.title=javan
            org.opencontainers.image.description=Javan native-first Java toolchain
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
          tags: ${{ steps.plan.outputs.scratch_tags }}

      - name: "📋 Manifests [${{ steps.plan.outputs.version }}]"
        shell: sh
        env:
          IMAGE_REPOSITORY: ${{ steps.plan.outputs.repository }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for tag in \
            "$RELEASE_VERSION" \
            "$RELEASE_VERSION-wolfi" \
            "$RELEASE_VERSION-distroless" \
            "$RELEASE_VERSION-scratch" \
            latest \
            wolfi \
            distroless \
            scratch
          do
            sh .github/scripts/verify-image.sh "$IMAGE_REPOSITORY:$tag"
          done

      - name: "🧪 Showcase [${{ steps.plan.outputs.version }}]"
        shell: sh
        env:
          IMAGE_REPOSITORY: ${{ steps.plan.outputs.repository }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          image="$IMAGE_REPOSITORY:$RELEASE_VERSION"
          JAVAN_IMAGE="$image" sh .github/scripts/verify-showcase.sh
