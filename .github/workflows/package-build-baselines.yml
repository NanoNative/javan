name: PackageBuildBaselines

on:
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: "🏷️ Version [date]"
        id: version
        shell: sh
        run: |
          version=$(date -u +'%Y.%-m.%-d')
          printf 'version=%s\n' "$version" | tee -a "$GITHUB_OUTPUT"

  measure:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, label: baseline_linux_x64 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, label: baseline_linux_arm64 }
          - { target: macos-aarch64, runner: macos-15, label: baseline_mac_arm64 }
    permissions:
      contents: read
    uses: ./.github/workflows/native-proof.yml
    with:
      ref: ${{ github.sha }}
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      label: ${{ matrix.label }}
      sanitizer_scope: none
      proof: package-baseline
      version: ${{ needs.prepare.outputs.version }}
      timeout_minutes: 90
    secrets: inherit

  summary:
    name: Summary
    needs: measure
    if: needs.measure.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: "📥 Download [package-build-baselines]"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-build-baseline-*
          path: baselines

      - name: "📈 Summary [package-build-baselines]"
        shell: sh
        run: |
          set -eu
          summary=$RUNNER_TEMP/package-build-baselines.md
          {
            printf '# Package-backed build baselines\n\n'
            printf 'Measurements are evidence, not regression thresholds.\n\n'
            printf '| Target | Result | Cache state | Wall seconds | CPU seconds | Peak RSS bytes | Artifact bytes |\n'
            printf '| --- | --- | --- | ---: | ---: | ---: | ---: |\n'
            for result in baselines/*/*.json; do
              jq -r '.results[] | "| `\(.target)` | `\(.id)` | `\(.cacheState)` | \(.wallSeconds) | \(.cpuSeconds) | \(.peakRssBytes) | \(.artifactBytes) |"' "$result"
            done
          } > "$summary"
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
