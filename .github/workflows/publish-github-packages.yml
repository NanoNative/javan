name: Packages

on:
  workflow_call:
    inputs:
      run_id:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing the build-workspace artifact
        required: true
        type: string
      dry_run:
        description: Reserved for future non-GitHub publication
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: packages-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    environment:
      name: github-packages
      url: ${{ format('https://github.com/{0}/packages', github.repository) }}
    steps:
      - name: "📥 Download [${{ inputs.run_id || github.run_id }}]"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-workspace
          path: ${{ github.workspace }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: "🔍 Java"
        id: java_info
        uses: YunaBraska/java-info-action@094dc70cf4050d156dded76d5574c962886c0b0a # 3.0.12

      - name: "☕ JDK [${{ steps.java_info.outputs.java_version }}]"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_info.outputs.java_version }}
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: "🧰 Wrapper"
        shell: sh
        run: chmod +x ./mvnw

      - name: "🚀 Publish [github]"
        shell: sh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          ./mvnw -B deploy:deploy-file \
            -DrepositoryId=github \
            "-Durl=https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DpomFile=pom.xml \
            "-Dfile=target/javan-${version}.jar" \
            "-Dsources=target/javan-${version}-sources.jar" \
            "-Djavadoc=target/javan-${version}-javadoc.jar"
