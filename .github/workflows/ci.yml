name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVAN_COVERAGE_SOFT_TARGET: "0.09"
  JAVAN_JUNIT_PARALLEL_ARGS: >-
    -Djunit.jupiter.execution.parallel.enabled=true
    -Djunit.jupiter.execution.parallel.mode.default=concurrent
    -Djunit.jupiter.execution.parallel.mode.classes.default=concurrent
    -Djunit.jupiter.execution.parallel.config.strategy=dynamic
    -Djunit.jupiter.execution.parallel.config.dynamic.factor=1.0

jobs:
  verify-core:
    name: verify-core (${{ matrix.target }})
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-aarch64
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify binding toolchains
        run: |
          go version
          rustc --version

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update \
              && sudo apt-get -o Acquire::ForceIPv4=true install -y --fix-missing build-essential mingw-w64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Resolve Maven local repository
        run: |
          repo=$(mvn -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)
          echo "MAVEN_REPO_LOCAL=$repo" >> "$GITHUB_ENV"

      - name: Install bundled external smoke artifacts
        run: |
          sh .github/scripts/install-external-probe-artifacts.sh "$MAVEN_REPO_LOCAL"

      - name: Verify core Maven suite
        run: |
          status=0
          mvn -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" $JAVAN_JUNIT_PARALLEL_ARGS -Dtest='!Cli*IntegrationTest,!CliExternalProbeAcceptanceIntegrationTest' -Djavan.coverage.check.skip=true verify || status=$?

          if [ -f target/jacoco-surefire.exec ] || [ -d target/jacoco-child ]; then
            mvn -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -DskipTests -Djavan.coverage.check.skip=true jacoco:merge@merge-coverage jacoco:report@report || true
          fi

          if [ "$status" -ne 0 ]; then
            python3 -c $'import pathlib\nimport xml.etree.ElementTree as ET\n\nreport = pathlib.Path("target/site/jacoco/jacoco.xml")\nif not report.exists():\n    print("JaCoCo report missing after failed verify.")\nelse:\n    root = ET.parse(report).getroot()\n    bundle = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}\n    for counter_type in ("BRANCH", "LINE"):\n        counter = bundle.get(counter_type)\n        if counter is None:\n            continue\n        missed = int(counter["missed"])\n        covered = int(counter["covered"])\n        total = missed + covered\n        ratio = covered / total if total else 1.0\n        print(f"JaCoCo {counter_type.lower()} bundle ratio: {covered}/{total} = {ratio:.6%}")'
            exit "$status"
          fi

      - name: Summarize coverage (non-blocking)
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("target/site/jacoco/jacoco.xml")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          target_ratio = float(os.environ["JAVAN_COVERAGE_SOFT_TARGET"])
          if not report.exists():
              print("::warning::JaCoCo report missing; coverage summary skipped.")
              summary_path.write_text(
                  "# Coverage\n\nJaCoCo report missing. Coverage summary skipped.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}
          summary_lines = [
              "# Coverage",
              "",
              f"Soft target: {target_ratio:.0%} (signal only, not a workflow gate)",
              "",
              "| Counter | Covered | Total | Ratio | Status |",
              "| --- | ---: | ---: | ---: | --- |",
          ]
          for counter_type in ("LINE", "BRANCH"):
              counter = counters.get(counter_type)
              if counter is None:
                  continue
              missed = int(counter["missed"])
              covered = int(counter["covered"])
              total = missed + covered
              ratio = covered / total if total else 1.0
              ratio_text = f"{covered}/{total} = {ratio:.6%}"
              status = "meets target" if ratio >= target_ratio else "below target"
              print(f"JaCoCo {counter_type.lower()} bundle ratio: {ratio_text}")
              if ratio < target_ratio:
                  print(f"::warning::JaCoCo {counter_type.lower()} coverage is below soft target {target_ratio:.0%}: {ratio_text}")
              else:
                  print(f"::notice::JaCoCo {counter_type.lower()} coverage meets soft target {target_ratio:.0%}: {ratio_text}")
              summary_lines.append(
                  f"| {counter_type.lower()} | {covered} | {total} | {ratio:.2%} | {status} |"
              )
          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-core-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            target/site/jacoco/**
            target/jacoco-merged.exec

  verify-cli-integration:
    name: verify-cli-integration (${{ matrix.shard }})
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: cli-general
            test-selector: >-
              Cli*IntegrationTest,!CliExternalProbeAcceptanceIntegrationTest,!CliPackagingIntegrationTest,!CliJdkSemanticsIntegrationTest,!CliThreadRuntimeIntegrationTest,!CliRuntimeTranslationIntegrationTest
          - shard: cli-jdk-semantics
            test-selector: >-
              CliJdkSemanticsIntegrationTest
          - shard: cli-runtime-heavy
            test-selector: >-
              CliThreadRuntimeIntegrationTest,CliRuntimeTranslationIntegrationTest
          - shard: packaging-and-probes
            test-selector: >-
              CliExternalProbeAcceptanceIntegrationTest,CliPackagingIntegrationTest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify binding toolchains
        run: |
          go version
          rustc --version

      - name: Install Linux native toolchain
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update \
              && sudo apt-get -o Acquire::ForceIPv4=true install -y --fix-missing build-essential mingw-w64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Resolve Maven local repository
        run: |
          repo=$(mvn -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)
          echo "MAVEN_REPO_LOCAL=$repo" >> "$GITHUB_ENV"

      - name: Install bundled external smoke artifacts
        run: |
          sh .github/scripts/install-external-probe-artifacts.sh "$MAVEN_REPO_LOCAL"

      - name: Verify CLI integration Maven suite
        run: |
          status=0
          mvn -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" $JAVAN_JUNIT_PARALLEL_ARGS -Dtest='${{ matrix.test-selector }}' -Djavan.coverage.check.skip=true verify || status=$?

          if [ -f target/jacoco-surefire.exec ] || [ -d target/jacoco-child ]; then
            mvn -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -DskipTests -Djavan.coverage.check.skip=true jacoco:merge@merge-coverage jacoco:report@report || true
          fi

          if [ "$status" -ne 0 ]; then
            python3 -c $'import pathlib\nimport xml.etree.ElementTree as ET\n\nreport = pathlib.Path("target/site/jacoco/jacoco.xml")\nif not report.exists():\n    print("JaCoCo report missing after failed verify.")\nelse:\n    root = ET.parse(report).getroot()\n    bundle = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}\n    for counter_type in ("BRANCH", "LINE"):\n        counter = bundle.get(counter_type)\n        if counter is None:\n            continue\n        missed = int(counter["missed"])\n        covered = int(counter["covered"])\n        total = missed + covered\n        ratio = covered / total if total else 1.0\n        print(f"JaCoCo {counter_type.lower()} bundle ratio: {covered}/{total} = {ratio:.6%}")'
            exit "$status"
          fi

      - name: Summarize coverage (non-blocking)
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("target/site/jacoco/jacoco.xml")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          target_ratio = float(os.environ["JAVAN_COVERAGE_SOFT_TARGET"])
          if not report.exists():
              print("::warning::JaCoCo report missing; coverage summary skipped.")
              summary_path.write_text(
                  "# Coverage\n\nJaCoCo report missing. Coverage summary skipped.\n",
                  encoding="utf-8"
              )
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}
          summary_lines = [
              "# Coverage",
              "",
              f"Soft target: {target_ratio:.0%} (signal only, not a workflow gate)",
              "",
              "| Counter | Covered | Total | Ratio | Status |",
              "| --- | ---: | ---: | ---: | --- |",
          ]
          for counter_type in ("LINE", "BRANCH"):
              counter = counters.get(counter_type)
              if counter is None:
                  continue
              missed = int(counter["missed"])
              covered = int(counter["covered"])
              total = missed + covered
              ratio = covered / total if total else 1.0
              ratio_text = f"{covered}/{total} = {ratio:.6%}"
              status = "meets target" if ratio >= target_ratio else "below target"
              print(f"JaCoCo {counter_type.lower()} bundle ratio: {ratio_text}")
              if ratio < target_ratio:
                  print(f"::warning::JaCoCo {counter_type.lower()} coverage is below soft target {target_ratio:.0%}: {ratio_text}")
              else:
                  print(f"::notice::JaCoCo {counter_type.lower()} coverage meets soft target {target_ratio:.0%}: {ratio_text}")
              summary_lines.append(
                  f"| {counter_type.lower()} | {covered} | {total} | {ratio:.2%} | {status} |"
              )
          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-cli-integration-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            target/site/jacoco/**
            target/jacoco-merged.exec

  native-smoke:
    name: native-smoke (${{ matrix.target }})
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            sanitizer-scope: full
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            sanitizer-scope: platform-smoke
          - target: macos-aarch64
            os: macos-15
            sanitizer-scope: platform-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify binding toolchains
        run: |
          go version
          rustc --version

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true update \
              && sudo apt-get -o Acquire::ForceIPv4=true install -y --fix-missing build-essential mingw-w64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Resolve Maven local repository
        run: |
          repo=$(mvn -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)
          echo "MAVEN_REPO_LOCAL=$repo" >> "$GITHUB_ENV"

      - name: Install bundled external smoke artifacts
        run: |
          sh .github/scripts/install-external-probe-artifacts.sh "$MAVEN_REPO_LOCAL"

      - name: Compile test fixtures
        run: mvn -q -Dmaven.repo.local="$MAVEN_REPO_LOCAL" $JAVAN_JUNIT_PARALLEL_ARGS -DskipTests compile test-compile

      - name: Verify acceptance suite
        env:
          JAVAN_MAVEN_REPO: ${{ env.MAVEN_REPO_LOCAL }}
          JAVAN_REQUIRE_EXTERNAL_SMOKE: "true"
        run: sh .github/scripts/acceptance.sh

      - name: Verify host target build
        run: java -cp target/classes javan.Main build src/test/resources/projects/acceptance/hello --target ${{ matrix.target }} --output hello-${{ matrix.target }}

      - name: Verify sanitizer smoke
        run: >-
          JAVAN_SANITIZER_REQUIRED=true
          JAVAN_SANITIZER_SCOPE='${{ matrix.sanitizer-scope }}'
          sh .github/scripts/sanitizer-suite.sh

      - name: Verify self-host package smoke
        run: >-
          JAVAN_PACKAGE_TARGET='${{ matrix.target }}'
          JAVAN_PACKAGE_SANITIZER_SCOPE='${{ matrix.sanitizer-scope }}'
          sh .github/scripts/verify-ci-package-smoke.sh

  windows-runtime-smoke:
    name: windows-runtime-smoke (${{ matrix.shard }})
    if: "${{ github.event_name != 'push' || !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: current-thread
            test-selector: >-
              javan.codegen.RuntimeFilesTest#
          - shard: worker-thread
            test-selector: >-
              javan.codegen.RuntimeFilesTest#

    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Set up MSYS2 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Windows C compiler
        shell: pwsh
        run: |
          gcc --version

      - name: Verify Windows runtime smoke
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin\\gcc.exe
        run: >-
          mvn -q
          '-Dtest=${{ matrix.test-selector }}'
          test

  release:
    name: release
    if: "${{ github.event_name == 'push' && github.ref_name == 'main' && !(startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore: prepare binary release repo')) }}"
    needs:
      - verify-core
      - verify-cli-integration
      - native-smoke
      - windows-runtime-smoke
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_enabled: true
    secrets: inherit
